name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KHAN_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=10000

    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.0
        ports:
          - 27017:27017

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check
        run: just check
