name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish khan-macros
        run: cargo publish -p khan-macros

      - name: Publish khan
        run: cargo publish -p khan
