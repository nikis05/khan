name: Publish (dry-run)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish khan-macros (dry-run)
        run: cargo publish -p khan-macros --dry-run

      - name: Publish khan (dry-run)
        run: cargo publish -p khan --dry-run
